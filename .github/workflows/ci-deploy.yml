name: CI and Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (workspaces)
        run: npm run build

      - name: Run Prisma migrations (if DATABASE_URL provided)
        if: ${{ secrets.DATABASE_URL }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd apps/api
          npx prisma migrate deploy --schema=prisma/schema.prisma

      - name: Deploy to Vercel
        if: ${{ secrets.VERCEL_TOKEN && secrets.VERCEL_ORG_ID && secrets.VERCEL_PROJECT_ID }}
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          # The Vercel project is the Vite application, not the monorepo root.
          # This picks up apps/web/vercel.json, including the SPA fallback rule.
          working-directory: apps/web
          vercel-args: "--prod"

      - name: Trigger Render deploy (if configured)
        if: ${{ secrets.RENDER_API_KEY && secrets.RENDER_SERVICE_ID }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "Triggering Render deploy for service $RENDER_SERVICE_ID"
          curl -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json" \
            -d '{}'

      - name: Print Vercel URL (logs)
        if: ${{ steps.deploy-to-vercel.outcome == 'success' }}
        run: echo "Vercel deployment triggered"

# NOTES:
# Add these repository secrets in GitHub Settings → Secrets and variables → Actions:
# - VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# - RENDER_API_KEY, RENDER_SERVICE_ID
# - DATABASE_URL (Neon)
# - JWT_ACCESS_SECRET, JWT_REFRESH_SECRET (if needed)
# The workflow will skip steps if the corresponding secrets are missing.
